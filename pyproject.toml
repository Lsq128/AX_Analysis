[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ax-analysis"
version = "0.1.0"
description = "AX_Analysis — AI multi-agent investment research SaaS (standalone)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- ai_server / tradingagents (vendored) runtime deps ---
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=6.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "typer>=0.21.0",
    "rich>=14.0.0",
    "httpx>=0.28.0",
    "PyJWT>=2.10.0",
]
worker = ["ax-analysis[api,storage]"]
cn = ["akshare>=1.14.0"]
storage = ["boto3>=1.35.0"]
dev = ["ax-analysis[worker,cn,storage]", "pytest>=8.0", "ruff>=0.15"]

[project.scripts]
ax-api = "ax_api.main:main"
ax-worker = "ax_worker.main:main"

[tool.setuptools.packages.find]
where = ["services/ai_server", "packages", "apps/api", "apps/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
